<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الموقع وأقرب فرع - Palmé Bakery</title>
    <!-- تضمين مكتبة الخرائط Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1b263b;
            --secondary: #e0a96d;
            --accent: #25D366;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #212529;
            --border: #ced4da;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 10px;
        }
        .container {
            max-width: 650px;
            margin: auto;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        h2 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
            font-weight: 900;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            background-color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: var(--secondary);
        }
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: block;
            width: 100%;
            margin-top: 15px;
            font-weight: 700;
            text-align: center;
            box-sizing: border-box;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1ebc57;
        }
        .btn-gps {
            background-color: var(--primary);
            margin-top: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 10px;
        }
        .btn-gps:hover {
            background-color: #2d3748;
        }
        .status {
            font-size: 13px;
            color: #6c757d;
            margin-top: 5px;
            text-align: center;
        }
        .branch-info-box {
            background: #fdf6ec;
            border: 1px solid var(--secondary);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
        }
        #map {
            height: 280px;
            width: 100%;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }
        .suggestions-list {
            position: absolute;
            background: white;
            border: 1px solid var(--border);
            border-radius: 0 0 8px 8px;
            max-height: 150px;
            overflow-y: auto;
            width: calc(100% - 50px);
            z-index: 1000;
            display: none;
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 13px;
            border-bottom: 1px solid #f1f1f1;
            text-align: right;
        }
        .suggestion-item:hover {
            background-color: #f8f9fa;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #dee2e6;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: var(--primary);
            color: white;
        }
        .table-responsive {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 10px;
        }
    </style>
</head>

<div class="container">
    <div class="card">
        <h2>🥐 بالميه بيكري - محدد الفروع والتوصيل</h2>
        
        <form id="orderForm" onsubmit="sendToWhatsApp(event)">
            
            <div class="form-group" style="position: relative;">
                <label>📍 اكتب عنوانك أو منطقتك (أو اضغط زر الـ GPS):</label>
                <div style="display: flex; gap: 8px;">

                </div>
                <div id="suggestions" class="suggestions-list"></div>
                <button type="button" class="btn btn-gps" onclick="getCurrentLocationGPS()">📍 تحديد موقعي الحالي بالـ GPS تلقائياً</button>
            </div>

            <p id="status" class="status">جاهز للبحث أو تحديد الموقع...</p>

            <div id="map"></div>

            <div class="branch-info-box" id="branchResultBox" style="display: none;">

                📌 <b>العنوان التفصيلي للفرع:</b> <span id="nearestBranchAddress">-</span><br>
                🛵 <b>تكلفة التوصيل لهذه المنطقة:</b> <span id="deliveryCost" style="color: #d9534f; font-weight: bold;">-</span><br>
                <a id="gmapsNavLink" href="#" target="_blank" class="btn" style="background-color: #4285F4; margin-top: 10px; padding: 8px; font-size: 13px;">🗺️ فتح الاتجاهات بخرائط جوجل للفرع</a>

            </div>

            <div class="form-group">
                <label>📞 رقم تلفون العميل:</label>
                <input type="tel" id="customerPhone" required placeholder="مثال: 01012345678">
            </div>

                <label>🏠 تفاصيل العنوان (رقم العمارة، الشقة، الدور):</label>

            </div>

            <button type="submit" id="whatsapp-btn" class="btn" style="display: none;">إرسال الطلب عبر واتساب 💬</button>
        </form>
    </div>

    <!-- جدول استعلام أسعار التوصيل -->

        <h3 style="font-size: 16px; color: var(--primary); text-align: center; margin-top: 0;">📋 جدول أسعار ومناطق التوصيل</h3>

    let map, userMarker, branchMarker, routeLine;

    // تعبئة جدول الأسعار
    function populatePriceTable(filter = '') {
        const tbody = document.getElementById('priceTableBody');
        tbody.innerHTML = '';
        deliveryDatabase.forEach(item => {
            if (filter === '' || item.area.toLowerCase().includes(filter.toLowerCase())) {
                const branchObj = branches.find(b => b.id === item.branch);
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${item.area}</td><td>${item.cost} ج.م</td><td>${branchObj ? branchObj.name.split('-')[1] : '-'}</td>`;
                tbody.appendChild(tr);
            }
        });
    }

    function filterPriceTable() {
        const query = document.getElementById('filterTableInput').value;
        populatePriceTable(query);
    }

    // حساب المسافة Haversine بين نقطتين
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // نصف قطر الأرض بالكيلومتر
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // تحديد أقرب فرع بناءً على الإحداثيات أو النص
    function processLocation(lat, lon, addressText = "") {
        userCoords = { lat, lon };
        
        // تحديث العلامة على الخريطة للمستخدم
        if (userMarker) map.removeLayer(userMarker);
        userMarker = L.marker([lat, lon]).addTo(map).bindPopup("موقعك الحالي").openPopup();

        // حساب أقرب فرع من الفروع الثابتة
        let nearest = branches[0];
        let minDistance = Infinity;

        branches.forEach(branch => {
            const dist = calculateDistance(lat, lon, branch.lat, branch.lng);
            if (dist < minDistance) {
                minDistance = dist;
                nearest = branch;
            }
        });

        selectedBranch = nearest;

        // مطابقة سعر التوصيل من قاعدة البيانات إذا وجد تطابق نصي، وإلا تقدير بناءً على المسافة أو السعر الافتراضي
        let matchedFee = 50; // سعر افتراضي
        const searchStr = addressText.toLowerCase();
        
        const foundItem = deliveryDatabase.find(item => searchStr.includes(item.area.toLowerCase()));
        if (foundItem) {
            matchedFee = foundItem.cost;
            // إذا كانت المنطقة تتبع فرعاً محدداً في الجدول، نحدد هذا الفرع بدقة أكبر
            const specificBranch = branches.find(b => b.id === foundItem.branch);
            if (specificBranch) selectedBranch = specificBranch;
        } else {
            // تقدير السعر بناء على المسافة التقريبية
            if (minDistance < 3) matchedFee = 35;
            else if (minDistance < 6) matchedFee = 50;
            else if (minDistance < 10) matchedFee = 75;
            else matchedFee = 100;
        }

        deliveryFeeFinal = matchedFee;

        // عرض النتيجة في الصندوق
        document.getElementById('nearestBranchName').innerText = selectedBranch.name;
        document.getElementById('nearestBranchAddress').innerText = selectedBranch.address;
        document.getElementById('deliveryCost').innerText = `${deliveryFeeFinal} جنيه مصري`;
        document.getElementById('gmapsNavLink').href = `https://www.google.com/maps/dir/?api=1&destination=${selectedBranch.lat},${selectedBranch.lng}`;
        document.getElementById('branchResultBox').style.display = 'block';
        document.getElementById('whatsapp-btn').style.display = 'block';

        // رسم مسار على الخريطة بين العميل والفرع الأقرب
        if (branchMarker) map.removeLayer(branchMarker);
        branchMarker = L.marker([selectedBranch.lat, selectedBranch.lng], {
            icon: L.icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41],
                popupAnchor: [1, -34],
                shadowSize: [41, 41]
            })
        }).addTo(map).bindPopup(selectedBranch.name);

        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline([[lat, lon], [selectedBranch.lat, selectedBranch.lng]], {
            color: '#e0a96d',
            weight: 4,
            dashArray: '5, 10'
        }).addTo(map);

        map.setView([lat, lon], 13);
    }

    // تفعيل الـ GPS
    function getCurrentLocationGPS() {
        if ("geolocation" in navigator) {
            document.getElementById('status').innerText = "جاري تحديد موقعك بدقة عبر الـ GPS...";
            navigator.geolocation.getCurrentPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                
                // جلب اسم العنوان العكسي عبر Nominatim
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`)
                    .then(res => res.json())
                    .then(data => {
                        const displayName = data.display_name || "موقع GPS محدد";
                        document.getElementById('searchAddressInput').value = displayName;
                        document.getElementById('customerDetailedAddress').value = displayName;
                        document.getElementById('status').innerText = "تم تحديد موقعك بنجاح واختيار الفرع الأقرب!";
                        processLocation(lat, lon, displayName);
                    })
                    .catch(() => {
                        processLocation(lat, lon, "");
                        document.getElementById('status').innerText = "تم تحديد إحداثيات الموقع بنجاح!";
                    });
            }, error => {
                document.getElementById('status').innerText = "تعذر تحديد الموقع، يرجى كتابة العنوان يدوياً.";
            }, { enableHighAccuracy: true });
        } else {
            alert("متصفحك لا يدعم خاصية تحديد الموقع.");
        }
    }

    // البحث التلقائي عند الكتابة في حقل العنوان
    let searchTimeout;
    function handleAddressInput(query) {
        const listDiv = document.getElementById('suggestions');
        if (query.length < 2) {
            listDiv.style.display = 'none';
            return;
        }

        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            // البحث المبدئي في قاعدة بيانات المناطق المحلية أولاً لسرعة الاستجابة
            const filtered = deliveryDatabase.filter(item => item.area.toLowerCase().includes(query.toLowerCase()));
            
            if (filtered.length > 0) {
                listDiv.innerHTML = '';
                filtered.slice(0, 5).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'suggestion-item';
                    div.innerHTML = `📍 <b>${item.area}</b> (توصيل: ${item.cost} ج.م)`;
                    div.onclick = () => {
                        document.getElementById('searchAddressInput').value = item.area;
                        document.getElementById('customerDetailedAddress').value = item.area;
                        listDiv.style.display = 'none';
                        
                        // اختيار الإحداثيات بناءً على الفرع المرتبط بالمنطقة
                        const matchedBranch = branches.find(b => b.id === item.branch) || branches[0];
                        processLocation(matchedBranch.lat + 0.01, matchedBranch.lng + 0.01, item.area);
                    };
                    listDiv.appendChild(div);
                });
                listDiv.style.display = 'block';
            } else {
                // البحث العام عبر خريطة OpenStreetMap Nominatim إذا لم يوجد في القائمة
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Cairo, Egypt')}&limit=5&accept-language=ar`)
                    .then(res => res.json())
                    .then(data => {
                        listDiv.innerHTML = '';
                        if (data.length > 0) {
                            data.forEach(place => {
                                const div = document.createElement('div');
                                div.className = 'suggestion-item';
                                div.innerText = place.display_name;
                                div.onclick = () => {
                                    document.getElementById('searchAddressInput').value = place.display_name;
                                    document.getElementById('customerDetailedAddress').value = place.display_name;
                                    listDiv.style.display = 'none';
                                    processLocation(parseFloat(place.lat), parseFloat(place.lon), place.display_name);
                                };
                                listDiv.appendChild(div);
                            });
                            listDiv.style.display = 'block';
                        } else {
                            listDiv.style.display = 'none';
                        }
                    });
            }
        }, 300);
    }

    // إرسال الطلب عبر واتساب مع كامل التفاصيل
    function sendToWhatsApp(event) {
        event.preventDefault();

        if (!selectedBranch) {
            alert("يرجى تحديد عنوانك أو موقعك أولاً لمعرفة الفرع الأقرب وتكلفة التوصيل.");
            return;
        }

        const name = document.getElementById('customerName').value;
        const phone = document.getElementById('customerPhone').value;
        const detailedAddress = document.getElementById('customerDetailedAddress').value;
        const searchInput = document.getElementById('searchAddressInput').value;

        const mapsLink = userCoords ? `https://maps.google.com/?q=${userCoords.lat},${userCoords.lon}` : "لم يتم تحديد إحداثيات GPS";

        const message = `🛍️ *طلب جديد عبر الموقع الإلكتروني - Palmé Bakery*\n\n` +
                        `🏢 *الفرع المُستقبل للطلب:* *${selectedBranch.name}*\n` +
                        `📌 *عنوان الفرع:* ${selectedBranch.address}\n\n` +
                        `👤 *اسم العميل:* ${name}\n` +
                        `📞 *رقم التلفون:* ${phone}\n` +
                        `📍 *المنطقة:* ${searchInput}\n` +
                        `🏠 *العنوان التفصيلي:* ${detailedAddress}\n` +
                        `🛵 *تكلفة التوصيل المحسوبة:* ${deliveryFeeFinal} ج.م\n\n` +
                        `🗺️ *موقع العميل (GPS Location):*\n${mapsLink}`;

        const whatsappUrl = `https://wa.me/${selectedBranch.phone}?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
    }
</script>
