<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الموقع وإرسال الطلب - Palmé Bakery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f7f6;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            margin: auto;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #1ebc57;
        }
        .status {
            font-size: 16px;
            color: #555;
            margin-top: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تحديد الموقع وإرسال الطلب 📍</h2>
    <p id="status" class="status">جاري تحديد موقعك والعنوان تلقائياً...</p>
    <a id="whatsapp-btn" class="btn" style="display: none;" target="_blank">إرسال عبر واتساب 💬</a>
</div>

<script>
    // ⚠️ ضع رقم الواتساب المخصص لاستقبال الطلبات بالصيغة الدولية (بدون + أو 00)
    // مثال لمصر: 201012345678
    const phoneNumber = "201000000000"; 

    window.onload = function() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        } else {
            document.getElementById("status").innerText = "متصفحك لا يدعم خدمة تحديد الموقع الجغرافي.";
        }
    };

    function successCallback(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;

        document.getElementById("status").innerText = "جاري جلب اسم الشارع والمنطقة...";

        // جلب العنوان النصي باللغة العربية باستخدام OpenStreetMap
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`)
            .then(response => response.json())
            .then(data => {
                const address = data.display_name || "تعذر تحديد اسم الشارع بدقة";
                sendToWhatsApp(address, googleMapsUrl);
            })
            .catch(() => {
                sendToWhatsApp("العنوان تقريبي (يرجى التأكيد)", googleMapsUrl);
            });
    }

    function errorCallback(error) {
        document.getElementById("status").innerText = "برجاء السماح بالوصول للموقع لتحديد عنوانك وإرسال الطلب.";
    }

    function sendToWhatsApp(address, mapLink) {
        // تجهيز نص الرسالة بشكل منظم وواضح
        const textMessage = `مرحباً، أود مشاركة موقعي معكم للطلب:\n\n📍 *العنوان:* \n${address}\n\n🗺️ *رابط الخريطة:* \n${mapLink}`;
        
        // تشفير الرسالة بالكامل لضمان عدم حدوث أي أخطاء في الرموز العربية أو المسافات
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(textMessage)}`;

        // إظهار زر الإرسال
        const btn = document.getElementById("whatsapp-btn");
        btn.href = whatsappUrl;
        btn.style.display = "inline-block";
        document.getElementById("status").innerText = "تم تحديد الموقع بنجاح! اضغط على الزر أدناه للإرسال عبر واتساب.";
    }
</script>

</body>
</html>
