<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إرسال الموقع إلى واتساب</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background-color: #f4f7f6;
        }
        .card {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
        .status {
            font-size: 16px;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تحديد الموقع وإرسال الطلب</h2>
    <p id="status" class="status">جاري تحديد موقعك والعنوان...</p>
    <a id="whatsapp-btn" class="btn" style="display: none;" target="_blank">إرسال عبر واتساب 💬</a>
</div>

<script>
    // ⚠️ ضع رقم الواتساب هنا بالصيغة الدولية (بدون علامة + أو أصفار في البداية)
    // مثال لمصر: 201012345678
    const phoneNumber = "201000000000"; 

    window.onload = function() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        } else {
            document.getElementById("status").innerText = "متصفحك لا يدعم تحديد الموقع.";
        }
    };

    function successCallback(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;

        document.getElementById("status").innerText = "جاري جلب تفاصيل العنوان...";

        // جلب العنوان النصي باستخدام خدمة OpenStreetMap المجانية
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`)
            .then(response => response.json())
            .then(data => {
                const address = data.display_name || "تعذر تحديد اسم الشارع بدقة";
                sendToWhatsApp(address, googleMapsUrl);
            })
            .catch(() => {
                sendToWhatsApp("عنوان تقريبي", googleMapsUrl);
            });
    }

    function errorCallback(error) {
        document.getElementById("status").innerText = "برجاء السماح بالوصول للموقع لتحديد عنوانك تلقائياً.";
    }

    function sendToWhatsApp(address, mapLink) {
        const message = `مرحباً، أود مشاركة موكعي معاكم:%0A%0A📍 *العنوان:*%0A${encodeURIComponent(address)}%0A%0A🗺️ *رابط الخريطة:*%0A${encodeURIComponent(mapLink)}`;
        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;

        // إظهار زر الإرسال
        const btn = document.getElementById("whatsapp-btn");
        btn.href = whatsappUrl;
        btn.style.display = "inline-block";
        document.getElementById("status").innerText = "تم تحديد الموقع بنجاح! اضغط على الزر أدناه للإرسال.";

        // تحويل تلقائي اختياري بعد ثانيتين (يمكنك تفعيله بفك التعليق عن السطر التالي):
        // window.location.href = whatsappUrl;
    }
</script>

</body>
</html>
