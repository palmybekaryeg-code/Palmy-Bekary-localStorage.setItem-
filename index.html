<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديد الموقع وإرسال الطلب - Palmé Bakery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
            background-color: #f4f7f6;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 420px;
            margin: auto;
            text-align: right;
        }
        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: block;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
        }
        .btn:hover {
            background-color: #1ebc57;
        }
        .status {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }
        .info-box {
            background: #e9f7ef;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #2d6a4f;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>تحديد الموقع وإرسال الطلب 📍</h2>
    
    <!-- عرض رقم الواتساب الذي سيتم الإرسال عليه -->
    <div class="info-box" id="target-phone-info">
        رقم استقبال الطلبات: <b>جاري التحميل...</b>
    </div>

    <form id="orderForm" onsubmit="sendToWhatsApp(event)">
        <label>👤 اسم العميل:</label>
        <input type="text" id="customerName" required placeholder="أدخل اسمك الكريم">

        <label>📞 رقم تلفون العميل:</label>
        <input type="tel" id="customerPhone" required placeholder="مثال: 01012345678">

        <label>🏠 تفاصيل العنوان (الشارع، العمارة، الشقة):</label>
        <textarea id="customerAddress" rows="2" required placeholder="جاري جلب العنوان تلقائياً..."></textarea>

        <p id="status" class="status">جاري تحديد موقعك الجغرافي بالـ GPS...</p>

        <button type="submit" id="whatsapp-btn" class="btn" style="display: none;">إرسال الطلب عبر واتساب 💬</button>
    </form>
</div>

<script>
    // ⚠️ ضع رقم الواتساب الخاص بالفرع هنا بالصيغة الدولية (بدون علامة + أو أصفار في البداية)
    // مثال لمصر: 201012345678
    const phoneNumber = "201000000000"; 

    // عرض الرقم الموجه إليه الرسالة في واجهة الصفحة للمستخدم
    document.getElementById("target-phone-info").innerHTML = `رقم استقبال الطلبات (واتساب): <b>+${phoneNumber}</b>`;

    let googleMapsUrl = "";

    window.onload = function() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(successCallback, errorCallback, {
                enableHighAccuracy: true,
                timeout: 10000
            });
        } else {
            document.getElementById("status").innerText = "متصفحك لا يدعم تحديد الموقع.";
        }
    };

    function successCallback(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        googleMapsUrl = `https://maps.google.com/?q=${lat},${lon}`;

        document.getElementById("status").innerText = "جاري جلب اسم الشارع والعنوان تلقائياً...";

        // جلب العنوان النصي باستخدام خدمة OpenStreetMap المجانية
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=ar`)
            .then(response => response.json())
            .then(data => {
                const address = data.display_name || "تعذر تحديد اسم الشارع بدقة";
                document.getElementById("customerAddress").value = address;
                document.getElementById("status").innerText = "تم تحديد الموقع والعنوان بنجاح! يرجى إكمال بياناتك.";
                document.getElementById("whatsapp-btn").style.display = "block";
            })
            .catch(() => {
                document.getElementById("customerAddress").value = "عنوان تقريبي (يرجى التعديل إذا لزم الأمر)";
                document.getElementById("status").innerText = "تم تحديد الموقع، يرجى مراجعة العنوان وإكمال البيانات.";
                document.getElementById("whatsapp-btn").style.display = "block";
            });
    }

    function errorCallback(error) {
        document.getElementById("status").innerText = "برجاء السماح بالوصول للموقع (GPS) لتسهيل التوصيل.";
        googleMapsUrl = "لم يتم تحديد الموقع من قبل العميل";
        document.getElementById("whatsapp-btn").style.display = "block";
    }

    function sendToWhatsApp(event) {
        event.preventDefault();

        const name = document.getElementById("customerName").value;
        const phone = document.getElementById("customerPhone").value;
        const address = document.getElementById("customerAddress").value;

        // صياغة الرسالة النهائية المنظمة
        const textMessage = `طلب جديد من موقع الفرع / الواتساب: +${phoneNumber}\n\n` +
                            `👤 *اسم العميل:* ${name}\n` +
                            `📞 *رقم التلفون:* ${phone}\n` +
                            `📍 *العنوان التفصيلي:* ${address}\n\n` +
                            `🗺️ *رابط الخريطة (Location):* \n${googleMapsUrl}`;

        const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(textMessage)}`;

        // فتح رابط الواتساب بالرسالة الجاهزة
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
